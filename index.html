<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f3eee2" />
    <meta name="author" content="Ludiane Figueiredo" />

    <!-- ⚠️ O trecho entre os dois marcadores abaixo NÃO é editado aqui: o `scripts/prerender.mjs`
         o troca, em cada rota, por título, descrição, canonical, Open Graph e JSON-LD próprios
         (gerados por `src/lib/seo.ts`). O que está entre eles só vale no `npm run dev`. -->
    <!--head-rota-->
    <title>Ludiane Figueiredo · Psicóloga · CRP 05/56264</title>
    <!--/head-rota-->

    <!-- O SVG é o ícone; o PNG é reserva e o único que o iOS aceita como apple-touch-icon. -->
    <link rel="icon" type="image/svg+xml" href="/marca-ludiane.svg" />
    <link rel="icon" type="image/png" sizes="512x512" href="/marca-ludiane.png" />
    <link rel="apple-touch-icon" href="/marca-ludiane.png" />

    <!-- As fontes vêm do próprio domínio (public/fontes/): nenhuma requisição a terceiro. -->
    <link rel="preload" href="/fontes/cormorant-garamond.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fontes/karla.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Sem JavaScript o HTML pré-renderizado continua legível: os blocos que entram ao rolar
         (Revela) nascem com opacidade 0 e só o JavaScript os revela. Sem ele, aparecem de uma vez. -->
    <noscript>
      <style>
        [data-revela] { opacity: 1 !important; transform: none !important; }
      </style>
    </noscript>
  </head>

  <body>
    <div id="root"><!--app--></div>
    <!--dados-->

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
